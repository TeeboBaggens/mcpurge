container_keys = ["servers"]
paths_windows = ["~/.mcp.json"]
project_paths = [".mcp.json"]
process_hints = ["devenv"]
notes = "Windows only. Same `servers` schema as VS Code, solution-level .mcp.json."

[[client]]
id = "zed"
name = "Zed"
kind = "ide"
confidence = "verified"
# Zed's key is context_servers, and it supports stdio only.
container_keys = ["context_servers"]
paths = ["$XDG_CONFIG/zed/settings.json"]
paths_windows = ["$CONFIG/Zed/settings.json"]
project_paths = [".zed/settings.json"]
process_hints = ["zed", "Zed"]
notes = "stdio only; older releases used assistant.mcp_servers, which the tree walk still finds."

[[client]]
id = "jetbrains"
name = "JetBrains IDEs"
kind = "ide"
confidence = "guess"
container_keys = ["mcpServers"]
paths_macos = ["~/Library/Application Support/JetBrains/*/options/mcp*.xml", "~/Library/Application Support/JetBrains/*/mcp.json"]
paths_linux = ["$XDG_CONFIG/JetBrains/*/options/mcp*.xml", "$XDG_CONFIG/JetBrains/*/mcp.json"]
paths_windows = ["$CONFIG/JetBrains/*/options/mcp*.xml", "$CONFIG/JetBrains/*/mcp.json"]
process_hints = ["idea", "pycharm", "webstorm", "rustrover", "goland", "clion"]
notes = "Primarily GUI-managed and often stored as XML, which mcpurge reads but will not rewrite."

[[client]]
id = "kiro"
name = "Kiro"
kind = "ide"
confidence = "verified"
container_keys = ["mcpServers"]
paths = ["~/.kiro/settings/mcp.json", "~/.kiro/agents/*.json"]
project_paths = [".kiro/settings/mcp.json", ".kiro/agents/*.json"]
process_hints = ["Kiro", "kiro"]
notes = "Workspace config wins over user config. Per-agent JSON files can also carry an mcpServers block."

