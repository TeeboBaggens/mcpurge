# ----------------------------------------------------------------- Runtimes ---
# Not MCP clients. Listed so the UI can say we looked, rather than leaving the
# user wondering why their local model runner is absent.

[[runtime]]
id = "ollama"
name = "Ollama"
process_hints = ["ollama", "Ollama"]
default_port = 11434
notes = "Inference server with no native MCP support (feature request still open). MCP reaches Ollama models through a separate host such as LM Studio, Goose, Continue or ollmcp."

[[runtime]]
id = "llama-cpp"
name = "llama.cpp server"
process_hints = ["llama-server", "llama.cpp"]
default_port = 8080
notes = "Raw inference server; no MCP layer of its own."

[[runtime]]
id = "vllm"
name = "vLLM"
process_hints = ["vllm"]
default_port = 8000
notes = "Inference server; no MCP layer of its own."
