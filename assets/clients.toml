[[client]]
id = "vscode"
name = "VS Code (Copilot)"
kind = "ide"
confidence = "verified"
# VS Code uses `servers`, not `mcpServers`. It also reads a portable .mcp.json.
container_keys = ["servers", "mcpServers"]
paths_macos = [
    "~/Library/Application Support/Code/User/mcp.json",
    "~/Library/Application Support/Code/User/settings.json",
    "~/Library/Application Support/Code/User/profiles/*/mcp.json",
]
paths_linux = ["$XDG_CONFIG/Code/User/mcp.json", "$XDG_CONFIG/Code/User/settings.json", "$XDG_CONFIG/Code/User/profiles/*/mcp.json"]
paths_windows = ["$CONFIG/Code/User/mcp.json", "$CONFIG/Code/User/settings.json", "$CONFIG/Code/User/profiles/*/mcp.json"]
project_paths = [".vscode/mcp.json", ".mcp.json"]
process_hints = ["Code Helper", "Code"]
notes = "Config files routinely contain comments; edits go through the JSONC splicer to preserve them."

[[client]]
id = "vscode-insiders"
name = "VS Code Insiders"
kind = "ide"
confidence = "reported"
container_keys = ["servers", "mcpServers"]
paths_macos = [
    "~/Library/Application Support/Code - Insiders/User/mcp.json",
    "~/Library/Application Support/Code - Insiders/User/settings.json",
]
paths_linux = ["$XDG_CONFIG/Code - Insiders/User/mcp.json", "$XDG_CONFIG/Code - Insiders/User/settings.json"]
paths_windows = ["$CONFIG/Code - Insiders/User/mcp.json", "$CONFIG/Code - Insiders/User/settings.json"]
project_paths = [".vscode-insiders/mcp.json"]
process_hints = ["Code - Insiders"]

[[client]]
id = "visual-studio"
name = "Visual Studio"
