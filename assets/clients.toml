# mcpurge client registry
#
# These entries are HINTS, not gospel. Published MCP config paths conflict
# between sources and drift between releases - Cline's own docs disagree with
# its code, Claude Desktop moved its servers out of claude_desktop_config.json,
# and Cherry Studio keeps them in Redux state with no file at all. So this file
# only tells the scanner where to look first; anything it misses is still
# caught by the content-based sweep in src/scan/discover.rs, which identifies a
# config by its SHAPE rather than its filename.
#
# A user copy at <config>/mcpurge/clients.toml replaces this list entirely,
# so you can add a tool without rebuilding.
#
# confidence:
#   verified - confirmed against the vendor's own docs or seen on a real machine
#   reported - consistent across secondary sources, not vendor-confirmed
#   guess    - plausible, unconfirmed; present so the scanner probes the path
#
# Path placeholders, expanded per OS:
#   ~             home directory
#   $CONFIG       macOS ~/Library/Application Support | Linux ~/.config | Windows %APPDATA%
#   $CONFIG_LOCAL macOS/Linux as above | Windows %LOCALAPPDATA%
#   $DATA         macOS ~/Library/Application Support | Linux ~/.local/share | Windows %APPDATA%
#   $XDG_CONFIG   ~/.config on every OS (many CLI tools use it even on macOS)
# `*` and `**` glob as usual. paths_macos/_windows/_linux add OS-specific entries.

# ---------------------------------------------------------------- Anthropic ---

[[client]]
id = "claude-code"
name = "Claude Code"
kind = "cli"
confidence = "verified"
container_keys = ["mcpServers"]
paths = ["~/.claude.json", "~/.claude/settings.json", "~/.claude/settings.local.json"]
project_paths = [".mcp.json", ".claude/settings.json", ".claude/settings.local.json"]
process_hints = ["claude"]
# ~/.claude.json nests per-project servers under projects.<abs path>.mcpServers.
# The parser walks the whole document, so those are found without special cases
# - and their absolute keys are what we harvest as project roots to scan.
notes = "Three scopes: user (~/.claude.json), project (.mcp.json), local."
harvest_project_keys = ["projects"]

[[client]]
id = "claude-desktop"
name = "Claude Desktop"
kind = "desktop"
confidence = "verified"
container_keys = ["mcpServers"]
paths_macos = [
    "~/Library/Application Support/Claude/claude_desktop_config.json",
    "~/Library/Application Support/Claude/Claude Extensions/**/manifest.json",
]
paths_windows = [
    "$CONFIG/Claude/claude_desktop_config.json",
    "$CONFIG/Claude/Claude Extensions/**/manifest.json",
]
paths_linux = ["$XDG_CONFIG/Claude/claude_desktop_config.json"]
process_hints = ["Claude Helper", "Claude"]
notes = "Recent builds moved MCP out of claude_desktop_config.json into installed extensions (.mcpb bundles), so that file may legitimately hold no servers."

