[package]
name = "mcpurge"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Find, inspect, stop and purge MCP servers across every AI agent on this machine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TeeboBaggens/mcpurge"
default-run = "mcpurge"

# All versions below are the latest stable releases, verified against the
# crates.io API on 2026-11-13. None of these crates publish an LTS track.
[dependencies]
# GUI. eframe is egui's native/web shell; egui_extras supplies the table widget.
eframe = { version = "0.37.0", default-features = false, features = [
    "default_fonts",
    "glow",      # OpenGL backend: widest driver support across the 3 targets
    "persistence",
    "wayland",
    "x11",
] }
egui = "0.37.0"
egui_extras = "0.37.0"

# Config parsing. serde_json uses preserve_order so rewritten files keep their
# original key order; jsonc-parser gives byte spans so we can splice a server
# out of a commented JSONC file without destroying the comments.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
jsonc-parser = { version = "0.34.0", features = ["serde"] }
toml = "1.2.1"
# Format-preserving TOML editing, so removing a server from Codex's
# config.toml leaves surrounding comments and layout untouched.
toml_edit = "0.25.19"
serde_norway = "0.9.42" # maintained serde_yaml fork; upstream is archived

# Process inspection and signalling.
sysinfo = "0.40.3"

# Filesystem, paths, time, trash.
dirs = "7.0.0"
walkdir = "2.5.0"
glob = "0.3.4"      # expands registry path patterns like globalStorage/*/settings/*.json
trash = "5.3.0"
jiff = "0.2.43"
open = "5.4.5"

# Errors.
anyhow = "1.0.104"
thiserror = "2.0.21"
# The self-updater. All four are the latest stable releases, verified against
# the crates.io index on 2026-11-15; none publish an LTS track.
#
# ureq is the smallest HTTP client that is not an async runtime, and the
# updater makes two requests. It is pinned to the platform's own TLS -
# Security.framework, SChannel, OpenSSL - rather than its default rustls stack:
# that keeps `ring` and its OpenSSL-licensed files out of the tree, so the
# cargo-deny licence allow-list stays as it is, and it means certificate trust
# follows the machine rather than a bundled root store.
ureq = { version = "3.5.2", default-features = false, features = [
    # Not "native-tls": that also pulls in a bundled copy of the Mozilla root
    # store. The point of using the platform's TLS is that trust follows the
    # machine, and a second set of roots in the binary would quietly undo that.
    "native-tls-no-default",
    "gzip",
] }
# OpenPGP, in Rust, with no gpg binary required at runtime: the updater refuses
# anything the release signing key did not sign, and that check has to work on
# a machine with no GnuPG on it. Default features off - the defaults pull in
# key *generation* and secret-key handling that a verifier has no use for.
pgp = { version = "0.21.1", default-features = false }
# Replacing a running executable is three different problems on three
# platforms (Windows will not let you unlink a running image). This is the
# crate that already solved all three.
self-replace = "1.5.1"
semver = "1.0.28"

[profile.release]
opt-level = 2
lto = "thin"
strip = true

[dev-dependencies]
# Drives real pointer input through the real widget tree, which is the only way
# to catch a widget that renders but does not respond. Latest stable, verified
# against the crates.io index on 2026-11-13; it tracks egui's version. Default
# features off: the snapshot/wgpu extras would pull in a GPU stack we do not
# need, and this adds only kittest and accesskit_consumer.
egui_kittest = { version = "0.37.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS menu bar is an NSMenu owned by NSApplication, which egui cannot
# draw into, so the menus are built natively here and the in-window menu bar is
# skipped. muda is Tauri's menu library and the maintained way to do this from
# Rust. Latest stable (0.21.2), verified against the crates.io index on
# 2026-11-15; no LTS track. Default features off and macOS only: it adds just
# crossbeam-channel and keyboard-types, and nothing at all to the Windows and
# Linux builds, which keep the in-window menu bar.
muda = { version = "0.21.2", default-features = false }
