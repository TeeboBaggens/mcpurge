# Cut a release: build the binaries, sign them with the mcpurge release key,
# and publish both to a GitHub release.
#
# The self-updater in src/update.rs will install nothing that this workflow did
# not sign, so the signing step is not decoration: a release published without
# it is a release no mcpurge will accept.
#
# Action versions were the latest releases on 2026-11-15.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag that disagrees with Cargo.toml would publish a binary that reports a
  # different version than the release it came from, and the updater compares
  # exactly those two numbers. Cheapest possible job, and it gates the rest.
  check-version:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with the crate version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag crate=$crate"
          if [ "$tag" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
            # macos-latest runners are arm64, so this build cannot run its own
            # tests. Everything else can, and does.
            cross: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test
        if: ${{ !matrix.cross }}
        run: cargo test --all

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the binary after its target
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/mcpurge.exe" \
               "dist/mcpurge-${{ matrix.target }}.exe"
          else
            cp "target/${{ matrix.target }}/release/mcpurge" \
               "dist/mcpurge-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: mcpurge-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Sign every binary with the release key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
            echo "::error::GPG_PRIVATE_KEY is not set, so nothing could be signed"
            exit 1
          fi
          # A throwaway keyring in the runner's workspace, so nothing is left
          # in the default one and the key material never touches $HOME.
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          for file in dist/mcpurge-*; do
            case "$file" in *.asc) continue;; esac
            gpg --batch --quiet --yes --pinentry-mode loopback \
                --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign --output "$file.asc" "$file"
          done
          # Verify against the public key committed to the repo, not against
          # the keyring we just imported: that is the key the shipped binaries
          # check signatures with, and this is where the two are proved equal.
          verify_home="$(mktemp -d)"
          GNUPGHOME="$verify_home" gpg --batch --quiet --import assets/release-signing-key.asc
          for sig in dist/*.asc; do
            GNUPGHOME="$verify_home" gpg --batch --verify "$sig" "${sig%.asc}"
          done
          rm -rf "$GNUPGHOME" "$verify_home"
          ls -l dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "mcpurge ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag \
            dist/*
